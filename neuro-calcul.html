<title>Neuro Calcul</title>
<link rel="icon" type="image/x-icon" href="neuro-calcul.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F5F1EA;
  --bg-raised: #FFFFFF;
  --bg-surface: #ECE8E0;
  --text: #2A3038;
  --text-2: #7A7268;
  --accent: #B87530;
  --accent-hover: #A0642A;
  --accent-subtle: #F0E0CC;
  --ok: #3A8A6B;
  --ok-subtle: #D8F0E4;
  --err: #BE4A3A;
  --err-subtle: #F5DCD8;
  --border: #D8D2C8;
  --input-bg: #FFFFFF;
  --input-border: #C8C0B4;
  --gauge-track: #E0DBD2;
  --gauge-fill: linear-gradient(90deg, #B87530, #D4983E);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #181F2A;
    --bg-raised: #1E2838;
    --bg-surface: #222E3E;
    --text: #D4CEC4;
    --text-2: #8A8478;
    --accent: #D4883A;
    --accent-hover: #E09848;
    --accent-subtle: #3A2E20;
    --ok: #48A882;
    --ok-subtle: #1A3028;
    --err: #D46050;
    --err-subtle: #3A1E1A;
    --border: #2E3A4A;
    --input-bg: #1A2535;
    --input-border: #354558;
    --gauge-track: #2A3644;
    --gauge-fill: linear-gradient(90deg, #D4883A, #E8A84E);
  }
}
:root[data-theme="dark"]{
  --bg: #181F2A;
  --bg-raised: #1E2838;
  --bg-surface: #222E3E;
  --text: #D4CEC4;
  --text-2: #8A8478;
  --accent: #D4883A;
  --accent-hover: #E09848;
  --accent-subtle: #3A2E20;
  --ok: #48A882;
  --ok-subtle: #1A3028;
  --err: #D46050;
  --err-subtle: #3A1E1A;
  --border: #2E3A4A;
  --input-bg: #1A2535;
  --input-border: #354558;
  --gauge-track: #2A3644;
  --gauge-fill: linear-gradient(90deg, #D4883A, #E8A84E);
}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  margin:0;padding:24px 16px;
  min-height:100vh;
  display:flex;justify-content:center;
  transition:background .3s;
}
.app{width:100%;max-width:580px;margin:0 auto}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;font-weight:700}
button{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  border:none;cursor:pointer;font-weight:600;
  transition:background .15s,transform .1s,box-shadow .15s;
}
button:active{transform:scale(.97)}

.screen{display:none;flex-direction:column;align-items:center;gap:24px;width:100%}
.screen.active{display:flex}

/* === HOME === */
.home-title{font-size:clamp(1.6rem,4vw,2rem);letter-spacing:-.02em;text-align:center;color:var(--accent)}
.home-subtitle{font-size:.85rem;color:var(--text-2);text-align:center;margin-top:-12px}

.level-card{
  width:100%;background:var(--bg-raised);border:1px solid var(--border);
  border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;
}
.level-header{display:flex;align-items:baseline;justify-content:space-between}
.level-number{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:3rem;font-weight:700;line-height:1;color:var(--accent)}
.level-rank{font-size:.8rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em}
.gauge{width:100%;height:6px;background:var(--gauge-track);border-radius:3px;overflow:hidden}
.gauge-fill{height:100%;background:var(--gauge-fill);border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.gauge-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-2)}
.ops-row{display:flex;gap:8px;flex-wrap:wrap}
.op-badge{
  font-size:.8rem;padding:4px 12px;border-radius:6px;
  background:var(--accent-subtle);color:var(--accent);font-weight:500;
}
.op-badge.locked{background:var(--bg-surface);color:var(--text-2);opacity:.5}

.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;
}
.stat-box{
  background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;
  padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;
}
.stat-value{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-label{font-size:.65rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}

.sparkline-card{
  width:100%;background:var(--bg-raised);border:1px solid var(--border);
  border-radius:10px;padding:16px 20px;
}
.sparkline-title{font-size:.7rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

.btn-primary{
  width:100%;padding:16px 24px;font-size:1.05rem;
  background:var(--accent);color:#fff;border-radius:10px;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{
  padding:10px 20px;font-size:.85rem;
  background:var(--bg-surface);color:var(--text-2);border-radius:8px;
}
.btn-secondary:hover{background:var(--border)}

/* === TRAINING === */
.training-bar{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:0 4px;font-size:.75rem;color:var(--text-2);
}
.training-level{display:flex;align-items:center;gap:8px}
.training-level-num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent)}
.mini-gauge{width:60px;height:4px;background:var(--gauge-track);border-radius:2px;overflow:hidden}
.mini-gauge-fill{height:100%;background:var(--gauge-fill);border-radius:2px;transition:width .4s}
.streak-badge{
  display:flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:12px;font-weight:500;font-size:.8rem;
  background:var(--accent-subtle);color:var(--accent);
  transition:transform .2s;
}
.streak-badge.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

.problem-area{
  width:100%;min-height:200px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  padding:40px 20px;margin:8px 0;
  background:var(--bg-raised);border:2px solid var(--border);border-radius:16px;
  transition:border-color .3s,background .3s;
}
.problem-area.correct{border-color:var(--ok);background:var(--ok-subtle)}
.problem-area.wrong{border-color:var(--err);background:var(--err-subtle)}

.problem-text{
  font-size:clamp(2rem,7vw,3.2rem);font-weight:600;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;text-align:center;
  transition:opacity .2s;line-height:1.2;
}
.problem-op{color:var(--accent);margin:0 .15em}

.answer-input{
  width:180px;padding:12px 16px;font-size:1.8rem;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-weight:500;
  background:var(--input-bg);color:var(--text);
  border:2px solid var(--input-border);border-radius:10px;
  outline:none;font-variant-numeric:tabular-nums;
  transition:border-color .2s;
}
.answer-input:focus{border-color:var(--accent)}
.answer-input:disabled{opacity:.6}

.feedback-text{
  font-size:.9rem;font-weight:500;min-height:1.3em;
  transition:opacity .2s;
}
.feedback-text.ok{color:var(--ok)}
.feedback-text.err{color:var(--err)}

.training-footer{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  font-size:.75rem;color:var(--text-2);
}
.timer{font-variant-numeric:tabular-nums}

/* === RECAP === */
.recap-title{font-size:1.6rem;text-align:center;color:var(--accent)}
.recap-card{
  width:100%;background:var(--bg-raised);border:1px solid var(--border);
  border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;
}
.recap-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.recap-label{font-size:.8rem;color:var(--text-2)}
.recap-value{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.recap-delta{font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:6px}
.recap-delta.up{background:var(--ok-subtle);color:var(--ok)}
.recap-delta.down{background:var(--err-subtle);color:var(--err)}
.recap-delta.flat{background:var(--bg-surface);color:var(--text-2)}

.recap-divider{height:1px;background:var(--border);margin:4px 0}

.recap-actions{display:flex;gap:12px;width:100%}
.recap-actions .btn-primary{flex:1}
.recap-actions .btn-secondary{flex:0 0 auto}

/* === RESET === */
.reset-link{
  font-size:.7rem;color:var(--text-2);background:none;
  text-decoration:underline;text-underline-offset:2px;
  opacity:.6;margin-top:8px;
}
.reset-link:hover{opacity:1}

@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-box{padding:12px 8px}
  .stat-value{font-size:1.1rem}
  .problem-area{padding:28px 16px;min-height:170px}
  .answer-input{width:150px;font-size:1.5rem}
}

/* === SYNC === */
.sync-card{
  width:100%;background:var(--bg-raised);border:1px solid var(--border);
  border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:12px;
}
.sync-title{font-size:.7rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.sync-actions{display:flex;gap:8px}
.sync-actions button{flex:1}

.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--bg-raised);border:1px solid var(--border);
  color:var(--text);padding:10px 20px;border-radius:8px;
  font-size:.85rem;font-family:'IBM Plex Mono',monospace;
  opacity:0;transition:transform .3s,opacity .3s;z-index:100;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:50;padding:16px;
}
.modal-overlay[hidden]{display:none}
.modal-box{
  background:var(--bg-raised);border:1px solid var(--border);
  border-radius:12px;padding:24px;width:100%;max-width:440px;
  display:flex;flex-direction:column;gap:16px;
}
.modal-box h3{font-size:1.1rem;color:var(--accent)}
.modal-box textarea{
  width:100%;height:100px;padding:12px;
  font-family:'IBM Plex Mono',monospace;font-size:.75rem;
  background:var(--input-bg);color:var(--text);
  border:2px solid var(--input-border);border-radius:8px;
  resize:vertical;outline:none;
}
.modal-box textarea:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px}
</style>

<div class="app">
  <!-- HOME -->
  <div id="home" class="screen active">
    <h1 class="home-title">Neuro Calcul</h1>
    <p class="home-subtitle">Entraînement adaptatif en calcul mental</p>
    <div class="level-card">
      <div class="level-header">
        <div><span class="level-number" id="h-level">5</span></div>
        <span class="level-rank" id="h-rank">Apprenti</span>
      </div>
      <div class="gauge"><div class="gauge-fill" id="h-gauge" style="width:50%"></div></div>

      <div class="ops-row" id="h-ops"></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><span class="stat-value" id="h-total">0</span><span class="stat-label">Questions</span></div>
      <div class="stat-box"><span class="stat-value" id="h-acc">—</span><span class="stat-label">Précision</span></div>

    </div>

    </div>
    <button class="btn-primary" onclick="startTraining()">Commencer l'entraînement</button>
    <div class="sync-card">

        <button class="btn-secondary" onclick="showImportModal()">Importer</button>
        <button class="btn-secondary" id="link-btn" onclick="showLinkModal()" style="display:none">Lier un appareil</button>
      </div>

      <span id="t-count">0 / 0</span>

    </div>
  </div>

  <!-- RECAP -->
  <div id="recap" class="screen">
    <h2 class="recap-title">Session terminée</h2>
    <div class="recap-card">
      <div class="recap-row"><span class="recap-label">Questions</span><span class="recap-value" id="r-count">0</span></div>

      <div class="recap-row"><span class="recap-label">Précision</span><span class="recap-value" id="r-acc">0%</span></div>
      <div class="recap-divider"></div>

      <div class="recap-row"><span class="recap-label">Meilleure série</span><span class="recap-value" id="r-streak">0</span></div>

      <button class="btn-primary" onclick="doImport()">Importer</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
const RANKS = [
  [1,'Débutant'],[4,'Apprenti'],[7,'Praticien'],[10,'Expert'],
  [13,'Maître'],[16,'Grand Maître'],[19,'Prodige']
];
const OPS_UNLOCK = {'+':100,'-':100,'×':350,'÷':500};
const K = 32;

function rank(level){
  let r='Débutant';
  for(const[l,n]of RANKS) if(level>=l) r=n;
  return r;
}
function levelOf(score){return Math.max(1,Math.min(20,Math.floor(score/100)))}
function progressOf(score){return(score%100)/100}

// --- State ---
let state;
function defaultState(){
  return{score:500,totalQ:0,totalOk:0,bestStreak:0,sessions:[]}
}
function loadState(){
  try{
    const d=localStorage.getItem('neuro-calcul');
    if(!d)return null;
    const p=JSON.parse(d);
    if(typeof p.score!=='number')return null;
    return p;
  }catch{return null}
}
function saveState(skipCloud){
  try{localStorage.setItem('neuro-calcul',JSON.stringify(state))}catch{}
  if(!skipCloud)pushToCloud();
}
state=loadState()||defaultState();

// --- Session state (not persisted) ---
let session=null;
let currentQ=null;
let timerInterval=null;
let questionStart=0;
let feedbackTimeout=null;

// --- Question Generation ---
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function generateQuestion(score){
  const ops=['+','-'];
  if(score>=350)ops.push('×');
  if(score>=500)ops.push('÷');
  const op=pick(ops);
  let a,b,answer,expr,diff;

  switch(op){
    case '+':
      if(score<200){a=randInt(1,9);b=randInt(1,9)}
      else if(score<400){a=randInt(10,50);b=randInt(5,50)}
      else if(score<700){a=randInt(10,99);b=randInt(10,99)}
      else if(score<1000){a=randInt(100,500);b=randInt(50,500)}
      else if(score<1400){a=randInt(100,999);b=randInt(100,999)}
      else{a=randInt(500,9999);b=randInt(500,9999)}
      answer=a+b;
      expr=`${a} <span class="problem-op">+</span> ${b}`;
      diff=a+b;
      break;
    case '-':
      if(score<200){a=randInt(2,9);b=randInt(1,a)}
      else if(score<400){a=randInt(20,60);b=randInt(5,a)}
      else if(score<700){a=randInt(30,99);b=randInt(10,a)}
      else if(score<1000){a=randInt(100,500);b=randInt(50,a)}
      else if(score<1400){a=randInt(100,999);b=randInt(50,a)}
      else{a=randInt(1000,9999);b=randInt(100,a)}
      answer=a-b;
      expr=`${a} <span class="problem-op">−</span> ${b}`;
      diff=a;
      break;
    case '×':
      if(score<500){a=randInt(2,5);b=randInt(2,9)}
      else if(score<700){a=randInt(2,12);b=randInt(2,12)}
      else if(score<1000){a=randInt(3,12);b=randInt(10,30)}
      else if(score<1300){a=randInt(10,50);b=randInt(10,50)}
      else{a=randInt(10,99);b=randInt(10,99)}
      answer=a*b;
      expr=`${a} <span class="problem-op">×</span> ${b}`;
      diff=a*b;
      break;
    case '÷':
      if(score<700){b=randInt(2,9);answer=randInt(2,12);a=b*answer}
      else if(score<1000){b=randInt(2,12);answer=randInt(5,30);a=b*answer}
      else if(score<1300){b=randInt(3,20);answer=randInt(10,50);a=b*answer}
      else{b=randInt(5,50);answer=randInt(10,99);a=b*answer}
      expr=`${a} <span class="problem-op">÷</span> ${b}`;
      diff=a;
      break;
  }

  const questionDiff=Math.log2(Math.max(diff,2))*100;
  const targetTime=1500+questionDiff*8;
  return{expr,answer,questionDiff,targetTime}
}

function calcScoreChange(correct,timeMs,qDiff,playerScore){
  const expected=1/(1+Math.pow(10,(qDiff-playerScore)/400));
  let timeMul=1;
  const target=1500+qDiff*8;
  if(correct){
    if(timeMs<target*.5)timeMul=1.3;
    else if(timeMs<target)timeMul=1;
    else if(timeMs<target*2)timeMul=.8;
    else timeMul=.6;
    return Math.round(K*(1-expected)*timeMul);
  }else{
    return Math.round(K*(0-expected));
  }
}

// --- UI ---
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  if(name==='home')renderHome();
}

function renderHome(){
  const lv=levelOf(state.score);
  const pr=progressOf(state.score);
  document.getElementById('h-level').textContent=lv;
  document.getElementById('h-rank').textContent=rank(lv);
  document.getElementById('h-gauge').style.width=(pr*100)+'%';
  document.getElementById('h-level-lo').textContent=lv;
  document.getElementById('h-level-hi').textContent=Math.min(lv+1,20);
  document.getElementById('h-total').textContent=state.totalQ;
  document.getElementById('h-acc').textContent=state.totalQ>0?Math.round(state.totalOk/state.totalQ*100)+'%':'—';
  document.getElementById('h-best').textContent=state.bestStreak;

  // Ops badges
  const opsEl=document.getElementById('h-ops');
  opsEl.innerHTML='';
  for(const[op,req]of Object.entries(OPS_UNLOCK)){
    const b=document.createElement('span');
    b.className='op-badge'+(state.score<req?' locked':'');
    b.textContent=op;
    opsEl.appendChild(b);
  }

  // Sparkline
  const card=document.getElementById('h-sparkline-card');
  if(state.sessions.length>=2){
    card.hidden=false;
    drawSparkline();
  }else{
    card.hidden=true;
  }
}

function drawSparkline(){
  const svg=document.getElementById('h-sparkline');
  const pts=state.sessions.slice(-30);
  if(pts.length<2){svg.innerHTML='';return}
  const scores=pts.map(s=>s.scoreAfter);
  const min=Math.min(...scores)-30;
  const max=Math.max(...scores)+30;
  const range=max-min||1;
  const w=520,h=80,px=16,py=8;
  const iw=w-px*2,ih=h-py*2;
  const coords=scores.map((s,i)=>{
    const x=px+i/(scores.length-1)*iw;
    const y=py+ih-(s-min)/range*ih;
    return[x,y];
  });
  const style=getComputedStyle(document.documentElement);
  const ac=style.getPropertyValue('--accent').trim();
  const ac2=style.getPropertyValue('--accent-subtle').trim();
  const t2=style.getPropertyValue('--text-2').trim();

  let path='M'+coords.map(c=>c.join(',')).join('L');
  let area=path+`L${coords[coords.length-1][0]},${h} L${coords[0][0]},${h} Z`;

  svg.innerHTML=`
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${ac}" stop-opacity=".25"/>
      <stop offset="100%" stop-color="${ac}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <path d="${path}" fill="none" stroke="${ac}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map((c,i)=>i===coords.length-1?
      `<circle cx="${c[0]}" cy="${c[1]}" r="4" fill="${ac}"/>`:'').join('')}
    <text x="${coords[coords.length-1][0]+8}" y="${coords[coords.length-1][1]+4}" fill="${t2}" font-size="11" font-family="IBM Plex Mono,monospace">${scores[scores.length-1]}</text>
  `;
}

// --- Training ---
function startTraining(){
  session={questions:[],startTime:Date.now(),scoreBefore:state.score,streak:0,bestStreak:0};
  currentQ=null;
  showScreen('training');
  nextQuestion();
}

function nextQuestion(){
  currentQ=generateQuestion(state.score);
  questionStart=Date.now();
  const area=document.getElementById('t-problem-area');
  area.classList.remove('correct','wrong');
  document.getElementById('t-problem').innerHTML=currentQ.expr+' <span class="problem-op">=</span>';
  const inp=document.getElementById('t-input');
  inp.value='';inp.disabled=false;inp.focus();
  document.getElementById('t-feedback').innerHTML='&nbsp;';
  updateTrainingUI();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    const el=((Date.now()-questionStart)/1000).toFixed(1);
    document.getElementById('t-timer').textContent=el+'s';
  },100);
}

function submitAnswer(){
  const inp=document.getElementById('t-input');
  const raw=inp.value.trim();
  if(raw==='')return;
  const userAns=parseInt(raw,10);
  if(isNaN(userAns))return;

  clearInterval(timerInterval);
  inp.disabled=true;
  const timeMs=Date.now()-questionStart;
  const correct=userAns===currentQ.answer;
  const delta=calcScoreChange(correct,timeMs,currentQ.questionDiff,state.score);

  state.score=Math.max(100,Math.min(2000,state.score+delta));
  state.totalQ++;
  if(correct)state.totalOk++;

  if(correct){
    session.streak++;
    if(session.streak>session.bestStreak)session.bestStreak=session.streak;
    if(session.streak>state.bestStreak)state.bestStreak=session.streak;
  }else{
    session.streak=0;
  }

  session.questions.push({correct,timeMs,delta});
  saveState();

  // Feedback
  const area=document.getElementById('t-problem-area');
  const fb=document.getElementById('t-feedback');
  if(correct){
    area.classList.add('correct');
    fb.className='feedback-text ok';
    fb.textContent=timeMs<currentQ.targetTime?'Rapide !':'Correct';
  }else{
    area.classList.add('wrong');
    fb.className='feedback-text err';
    fb.textContent='Réponse : '+currentQ.answer;
  }

  updateTrainingUI();

  const sb=document.getElementById('t-streak');
  sb.classList.remove('pop');
  void sb.offsetWidth;
  sb.classList.add('pop');

  feedbackTimeout=setTimeout(()=>nextQuestion(),correct?700:1500);
}

function updateTrainingUI(){
  const lv=levelOf(state.score);
  const pr=progressOf(state.score);
  document.getElementById('t-level').textContent=lv;
  document.getElementById('t-gauge').style.width=(pr*100)+'%';
  document.getElementById('t-streak').textContent=session.streak>0?session.streak+' ✓':'0';
  const q=session.questions.length;
  const ok=session.questions.filter(x=>x.correct).length;
  document.getElementById('t-count').textContent=ok+' / '+q;
}

function endSession(){
  clearInterval(timerInterval);
  clearTimeout(feedbackTimeout);
  if(session.questions.length>0){
    const qs=session.questions;
    const ok=qs.filter(x=>x.correct).length;
    const avgTime=Math.round(qs.reduce((s,q)=>s+q.timeMs,0)/qs.length);
    state.sessions.push({
      date:new Date().toISOString(),
      count:qs.length,
      correct:ok,
      avgTimeMs:avgTime,
      scoreBefore:session.scoreBefore,
      scoreAfter:state.score
    });
    if(state.sessions.length>100)state.sessions=state.sessions.slice(-100);
    saveState();
    showRecap(qs,ok,avgTime);
  }else{
    showScreen('home');
  }
}

function showRecap(qs,ok,avgTime){
  document.getElementById('r-count').textContent=qs.length;
  document.getElementById('r-correct').textContent=ok;
  document.getElementById('r-acc').textContent=Math.round(ok/qs.length*100)+'%';
  document.getElementById('r-time').textContent=(avgTime/1000).toFixed(1)+'s';
  document.getElementById('r-streak').textContent=session.bestStreak;

  const delta=state.score-session.scoreBefore;
  const dEl=document.getElementById('r-delta');
  dEl.textContent=(delta>=0?'+':'')+delta;
  dEl.className='recap-delta '+(delta>0?'up':delta<0?'down':'flat');

  document.getElementById('r-level').textContent='Niv. '+levelOf(state.score)+' — '+rank(levelOf(state.score));
  showScreen('recap');
}

function resetProgress(){
  if(!confirm('Réinitialiser toute ta progression ?'))return;
  state=defaultState();
  saveState();
  renderHome();
}

// --- Sync ---
function exportState(){
  const data={
    v:1,s:state.score,q:state.totalQ,o:state.totalOk,b:state.bestStreak,
    h:state.sessions.slice(-30).map(s=>[s.count,s.correct,s.avgTimeMs,s.scoreBefore,s.scoreAfter])
  };
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>showToast('Code copié !')).catch(()=>showExportFallback(code));
  }else{
    showExportFallback(code);
  }
}
function showExportFallback(code){
  document.getElementById('import-input').value=code;
  document.getElementById('import-modal').hidden=false;
  document.getElementById('import-input').select();
  showToast('Copie le code ci-dessus');
}
function showImportModal(){
  document.getElementById('import-input').value='';
  document.getElementById('import-modal').hidden=false;
  document.getElementById('import-input').focus();
}
function closeImportModal(){document.getElementById('import-modal').hidden=true}
function doImport(){
  const raw=document.getElementById('import-input').value.trim();
  if(!raw)return;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(d.v!==1)throw 0;
    state.score=d.s;
    state.totalQ=d.q;
    state.totalOk=d.o;
    state.bestStreak=Math.max(state.bestStreak,d.b);
    state.sessions=(d.h||[]).map(h=>({
      date:new Date().toISOString(),count:h[0],correct:h[1],
      avgTimeMs:h[2],scoreBefore:h[3],scoreAfter:h[4]
    }));
    saveState();renderHome();closeImportModal();
    showToast('Progression importée !');
  }catch{showToast('Code invalide')}
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('show');
  void t.offsetWidth;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

let db=null;
let cloudUid=null;

const firebaseConfig={
  apiKey:"AIzaSyAX3iCMZELyYe9kcN0suk-_dPxzbeqF7Ac",
  authDomain:"neuro-calcul.firebaseapp.com",
  projectId:"neuro-calcul",
  storageBucket:"neuro-calcul.firebasestorage.app",
  messagingSenderId:"469161197984",
  appId:"1:469161197984:web:d4694f9d0813ac447c24c5"
};

function pushToCloud(){
  if(!db||!cloudUid)return;
  const docId=getSyncDocId();
  db.collection('users').doc(docId).set({
    score:state.score,totalQ:state.totalQ,totalOk:state.totalOk,
    bestStreak:state.bestStreak,
    sessions:state.sessions.slice(-50),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(()=>{});
}

function mergeCloudData(c){
  if(c.totalQ>state.totalQ){
    state.score=c.score;state.totalQ=c.totalQ;state.totalOk=c.totalOk;
    state.bestStreak=Math.max(state.bestStreak,c.bestStreak||0);
    state.sessions=c.sessions||[];
    try{localStorage.setItem('neuro-calcul',JSON.stringify(state))}catch{}
    renderHome();
    return true;
  }
  return false;
}

async function initCloud(){
  if(typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    const cred=await firebase.auth().signInAnonymously();
    cloudUid=cred.user.uid;
    try{localStorage.setItem('neuro-calcul-uid',cloudUid)}catch{}

    const docId=getSyncDocId();
    const snap=await db.collection('users').doc(docId).get();
    if(snap.exists){
      if(!mergeCloudData(snap.data())&&state.totalQ>0) pushToCloud();
    }else if(state.totalQ>0){
      pushToCloud();
    }

    db.collection('users').doc(docId).onSnapshot(snap=>{
      if(!snap.exists)return;
      mergeCloudData(snap.data());
    });

    updateSyncStatus(true);
  }catch(e){
    console.warn('Cloud sync unavailable:',e);
    updateSyncStatus(false);
  }
}

function updateSyncStatus(connected){
  const el=document.getElementById('sync-status');
  if(!el)return;
  if(connected){
    el.textContent='Cloud connecté';
    el.style.color='var(--ok)';
    const lb=document.getElementById('link-btn');
    if(lb)lb.style.display='';
  }else{
    el.textContent='Hors ligne';
    el.style.color='var(--text-2)';
  }
}

function getSyncDocId(){
  try{return localStorage.getItem('neuro-calcul-linked')||cloudUid}catch{return cloudUid}
}

function showLinkModal(){
  const docId=getSyncDocId();
  const code=btoa(docId).replace(/=+$/,'');
  document.getElementById('import-input').value='';
  document.getElementById('import-modal').hidden=false;
  document.querySelector('#import-modal h3').textContent='Lier un appareil';
  document.querySelector('#import-modal textarea').placeholder=
    'Ton code de liaison :\n'+code+'\n\nOu colle le code d\'un autre appareil ici pour synchroniser.';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>showToast('Code copié !')).catch(()=>{});
  }
  document.querySelector('#import-modal .btn-primary').onclick=doLink;
}

function doLink(){
  const raw=document.getElementById('import-input').value.trim();
  if(!raw){closeImportModal();return}
  try{
    let padded=raw;
    while(padded.length%4)padded+='=';
    const linkedUid=atob(padded);
    if(!linkedUid||linkedUid.length<10)throw 0;
    try{localStorage.setItem('neuro-calcul-linked',linkedUid)}catch{}
    if(db){
      db.collection('users').doc(linkedUid).get().then(snap=>{
        if(snap.exists) mergeCloudData(snap.data());
        else pushToCloud();
        db.collection('users').doc(linkedUid).onSnapshot(snap=>{
          if(!snap.exists)return;
          mergeCloudData(snap.data());
        });
      });
    }
    closeImportModal();
    showToast('Appareils liés !');
  }catch{showToast('Code invalide')}
  document.querySelector('#import-modal h3').textContent='Importer une progression';
  document.querySelector('#import-modal textarea').placeholder='Colle ton code de synchronisation ici...';
  document.querySelector('#import-modal .btn-primary').onclick=doImport;
}

// Input handling
document.getElementById('t-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')submitAnswer();
});

// Init
renderHome();
initCloud();
</script>
